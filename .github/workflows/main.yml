name: CI/CD Pipeline

# Run on every push to main (full pipeline: test -> build -> push -> verify)
# and on pull requests to main (test + build only, nothing is pushed).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: nodejs-demo-app

jobs:
  # ---------------------------------------------------------------
  # 1) TEST: install dependencies and run the Jest test suite
  # ---------------------------------------------------------------
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Run tests
        run: npm test

  # ---------------------------------------------------------------
  # 2) BUILD & PUSH: build the Docker image; push to Docker Hub on main
  # ---------------------------------------------------------------
  build-and-push:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------
  # 3) VERIFY DEPLOYMENT: pull the pushed image and smoke-test it
  # ---------------------------------------------------------------
  smoke-test:
    name: Smoke-test deployed image
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request'
    steps:
      - name: Pull and run image from Docker Hub
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA::7}"
          docker pull "$IMAGE"
          docker run -d --name app -p 3000:3000 "$IMAGE"

      - name: Check /health endpoint
        run: |
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:3000/health; then
              echo; echo "Deployment verified ✅"; exit 0
            fi
            sleep 2
          done
          echo "App did not become healthy ❌"; docker logs app; exit 1
